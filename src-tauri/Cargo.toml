[package]
name = "quepic"
version = "0.9.0"
description = "本地优先的语雀文件与图片云盘管理工具"
authors = ["weepwood"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "quepic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
