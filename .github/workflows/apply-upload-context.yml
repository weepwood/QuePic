          }

          export function getStoredUploadContext(accountName: string): UploadContextResult | null {
              try {
                  const raw = localStorage.getItem(uploadContextKey(accountName));
                  if (!raw) return null;
                  const context = JSON.parse(raw) as UploadContextResult;
                  if (
