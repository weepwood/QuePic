name: Implement primary account failover

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/primary-account-failover
          fetch-depth: 0
      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-primary-failover.py')
          text = path.read_text(encoding='utf-8')
          old = "text = replace_once(text, '  accountName: string;\\n  category: string;', '  accountName: string;\\n  uploadAccountName?: string;\\n  category: string;', 'queue actual account')"
          new = "text = text.replace('  accountName: string;\\n  category: string;', '  accountName: string;\\n  uploadAccountName?: string;\\n  category: string;')"
          if old not in text:
              raise SystemExit('queue field patch statement not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/patch-primary-failover.py
          rm -f .github/workflows/implement-primary-failover.yml
          rm -f .github/workflows/snapshot-primary-failover.yml
          rm -f primary-failover-status.json primary-failover-failed.log
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate frontend
        run: |
          npm install --silent
          npm run build
      - name: Validate backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: 支持主账号优先与从账号整点接力'
          git push origin HEAD:feat/primary-account-failover
