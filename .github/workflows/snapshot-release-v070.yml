name: Snapshot QuePic v0.7.0 Release

on:
  push:
    branches: [release/v0.7.0]
    paths: [.github/workflows/snapshot-release-v070.yml]

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.0

      - name: Collect current status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 00d444cc898f9bf8a557bb2920896747786b1376
          RELEASE_TAG: v0.7.0
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=20")"
          release='{}'
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > /tmp/release.json 2>/dev/null; then
            release="$(cat /tmp/release.json)"
          fi
          jq -n \
            --arg checked_at "$(date -u +%FT%TZ)" \
            --argjson runs "$runs" \
            --argjson release "$release" \
            '{checked_at:$checked_at,runs:[$runs.workflow_runs[] | {id,name,status,conclusion,event,head_sha,html_url}],release:(if ($release.id // null) then {id:$release.id,tag_name:$release.tag_name,name:$release.name,draft:$release.draft,prerelease:$release.prerelease,html_url:$release.html_url,assets:[$release.assets[] | {name,size,browser_download_url}]} else null end)}' > release-current-v0.7.0.json

      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-current-v0.7.0.json
          git commit -m "chore: snapshot v0.7.0 release" || exit 0
          git push origin HEAD:release/v0.7.0

# refreshed after both platform jobs completed
