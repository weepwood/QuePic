name: Final clean image library

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'feat/image-library-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Preserve existing tags on untagged duplicate upload
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let existing = database::update_asset_category(&database_path, existing.id, &category)?;
              let existing = database::update_asset_tags(&database_path, existing.id, &tags)?;'''
          new = '''    let existing = database::update_asset_category(&database_path, existing.id, &category)?;
              let existing = if tags.is_empty() {
                  existing
              } else {
                  database::update_asset_tags(&database_path, existing.id, &tags)?
              };'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one duplicate-tag update, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rustfmt --edition 2021 src-tauri/src/lib.rs

      - name: Verify application
        run: |
          npm install --silent
          npm run build
          npm run icons
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Clean generated files and commit
        run: |
          git fetch origin main:refs/remotes/origin/main
          git restore --source=origin/main --worktree --staged src-tauri/icons src-tauri/gen
          rm -f src-tauri/Cargo.lock package-lock.json
          rm .github/workflows/final-clean-image-library.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 保留重复图片标签并清理生成文件"
          git push origin HEAD:feat/image-library-overhaul
