name: Cleanup image library PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/image-library-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore generated and unrelated files
        run: |
          git fetch origin main
          git restore --source=origin/main --worktree --staged \
            src-tauri/icons \
            src-tauri/gen \
            src-tauri/src/credentials.rs
          rm .github/workflows/cleanup-image-library-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 清理图库重构无关生成文件"
          git push origin HEAD:feat/image-library-overhaul
