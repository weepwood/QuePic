name: Cleanup Cloud Drive Icons

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'feat/yuque-cloud-drive' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yuque-cloud-drive
          fetch-depth: 0
      - name: Restore icon directory exactly from main
        run: |
          git fetch origin main
          rm -rf src-tauri/icons
          git checkout origin/main -- src-tauri/icons
          rm .github/workflows/cleanup-cloud-drive-icons.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: 恢复原有图标目录"
          git push origin HEAD:feat/yuque-cloud-drive
