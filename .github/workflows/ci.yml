name: Verify Release

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  release-assets:
    name: Verify v0.5.1 assets
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Windows and macOS installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v0.5.1"

          for attempt in $(seq 1 60); do
            release="$(curl -fsSL "${headers[@]}" "$release_api" 2>/dev/null || true)"
            if [ -n "$release" ]; then
              draft="$(jq -r '.draft // true' <<< "$release")"
              prerelease="$(jq -r '.prerelease // true' <<< "$release")"
              exe_count="$(jq '[.assets[]? | select(.state == "uploaded" and (.name | endswith(".exe")))] | length' <<< "$release")"
              dmg_count="$(jq '[.assets[]? | select(.state == "uploaded" and (.name | endswith(".dmg")))] | length' <<< "$release")"
              echo "attempt=${attempt} draft=${draft} prerelease=${prerelease} exe=${exe_count} dmg=${dmg_count}"
              jq -r '.assets[]? | "asset=\(.name) size=\(.size) state=\(.state) url=\(.browser_download_url)"' <<< "$release"

              if [ "$draft" = "false" ] && [ "$prerelease" = "false" ] && [ "$exe_count" -ge 1 ] && [ "$dmg_count" -ge 1 ]; then
                echo "QuePic v0.5.1 release is published with Windows and macOS installers."
                exit 0
              fi
            else
              echo "attempt=${attempt}: release endpoint not available yet"
            fi
            sleep 10
          done

          echo "QuePic v0.5.1 did not expose both installers within the verification window." >&2
          exit 1
