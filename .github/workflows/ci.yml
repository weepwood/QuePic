name: Verify Release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-assets:
    name: Verify v0.5.0 assets
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Windows and macOS installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v0.5.0"

          for attempt in $(seq 1 40); do
            response="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" 2>/dev/null || true)"

            if [ -n "$response" ]; then
              draft="$(jq -r '.draft // true' <<< "$response")"
              prerelease="$(jq -r '.prerelease // true' <<< "$response")"
              exe_count="$(jq '[.assets[]? | select(.state == "uploaded" and (.name | endswith(".exe")))] | length' <<< "$response")"
              dmg_count="$(jq '[.assets[]? | select(.state == "uploaded" and (.name | endswith(".dmg")))] | length' <<< "$response")"

              echo "attempt=${attempt} draft=${draft} prerelease=${prerelease} exe=${exe_count} dmg=${dmg_count}"
              jq -r '.assets[]? | "asset=\(.name) size=\(.size) state=\(.state) url=\(.browser_download_url)"' <<< "$response"

              if [ "$draft" = "false" ] && [ "$prerelease" = "false" ] && [ "$exe_count" -ge 1 ] && [ "$dmg_count" -ge 1 ]; then
                echo "QuePic v0.5.0 release is published with Windows and macOS installers."
                exit 0
              fi
            else
              echo "attempt=${attempt}: release endpoint not available yet"
            fi

            sleep 15
          done

          echo "QuePic v0.5.0 did not expose both installers within the verification window." >&2
          exit 1
