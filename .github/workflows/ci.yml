name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quepic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-large-upload-queue-optimization:
    name: Apply and verify queue optimization
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compact-preview-cache
          fetch-depth: 0
      - name: Apply optimization
        run: |
          sed -i 's/item.result.asset.remote_url/item.result?.asset.remote_url/' .github/scripts/apply_large_upload_queue_optimization.py
          python .github/scripts/apply_large_upload_queue_optimization.py
      - name: Build React frontend
        id: optimized_frontend
        continue-on-error: true
        run: |
          npm install --silent
          npm run build > .github/queue-optimization-build.log 2>&1
      - name: Upload frontend diagnostics
        if: steps.optimized_frontend.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: queue-optimization-diagnostics
          path: |
            src/App.tsx
            .github/queue-optimization-build.log
      - name: Stop after frontend failure
        if: steps.optimized_frontend.outcome == 'failure'
        run: exit 1
      - name: Check and test Rust backend
        run: |
          sudo apt-get update -qq > /tmp/apt.log 2>&1
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config >> /tmp/apt.log 2>&1
          npm run icons
          rustup default stable > /dev/null
          cargo check --quiet --manifest-path src-tauri/Cargo.toml
          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib
      - name: Restore CI and commit verified changes
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/scripts/apply_large_upload_queue_optimization.py
          rm -f .github/workflows/optimize-large-upload-queue-once.yml
          rm -f .github/queue-optimization-build.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/styles.css src-tauri/src/lib.rs src-tauri/src/yuque.rs .github/workflows/ci.yml .github/scripts/apply_large_upload_queue_optimization.py .github/workflows/optimize-large-upload-queue-once.yml .github/queue-optimization-build.log
          git commit -m "优化 50 MB 上传与大队列滚动"
          git push origin HEAD:feat/compact-preview-cache

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --silent
      - name: Build React frontend
        run: npm run build

  icons:
    name: Platform icons
    runs-on: ubuntu-latest
    steps:
      - name: Generate icons
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          npm install --silent > /tmp/npm-install.log 2>&1
          set +e
          npm run icons > /tmp/icons.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "图标生成失败："
            tail -n 80 /tmp/icons.log
          fi
          exit "$status"

  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source, generate icons, check and test backend
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          sudo apt-get update -qq > /tmp/apt.log 2>&1
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config >> /tmp/apt.log 2>&1
          npm install --silent > /tmp/npm-install.log 2>&1
          npm run icons > /tmp/icons.log 2>&1
          rustup default stable > /dev/null

          set +e
          cargo check --quiet --manifest-path src-tauri/Cargo.toml > /tmp/cargo-check.log 2>&1
          check_status=$?
          if [ "$check_status" -ne 0 ]; then
            echo "Rust 编译失败："
            tail -n 120 /tmp/cargo-check.log
            exit "$check_status"
          fi

          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib > /tmp/cargo-test.log 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            echo "Rust 单元测试失败："
            tail -n 120 /tmp/cargo-test.log
          fi
          exit "$test_status"
