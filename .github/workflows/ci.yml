name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quepic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply_changes:
    name: Apply queued source update
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply burst upload and document UI update
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/trigger-burst-upload-ui ]; then
            echo "No queued source update."
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-burst-upload-ui.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-burst-upload-ui.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-burst-upload-ui.py
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/trigger-burst-upload-ui .github/workflows/apply-burst-upload-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 优化小时批量上传与文件夹文档布局"
          git push origin HEAD:${{ github.head_ref }}

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --silent
      - name: Build React frontend
        run: npm run build

  icons:
    name: Platform icons
    runs-on: ubuntu-latest
    steps:
      - name: Generate icons
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          npm install --silent > /tmp/npm-install.log 2>&1
          set +e
          npm run icons > /tmp/icons.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "图标生成失败："
            tail -n 80 /tmp/icons.log
          fi
          exit "$status"

  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source, generate icons, check and test backend
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          sudo apt-get update -qq > /tmp/apt.log 2>&1
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config >> /tmp/apt.log 2>&1
          npm install --silent > /tmp/npm-install.log 2>&1
          npm run icons > /tmp/icons.log 2>&1
          rustup default stable > /dev/null

          set +e
          cargo check --quiet --manifest-path src-tauri/Cargo.toml > /tmp/cargo-check.log 2>&1
          check_status=$?
          if [ "$check_status" -ne 0 ]; then
            echo "Rust 编译失败："
            tail -n 120 /tmp/cargo-check.log
            exit "$check_status"
          fi

          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib > /tmp/cargo-test.log 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            echo "Rust 单元测试失败："
            tail -n 120 /tmp/cargo-test.log
          fi
          exit "$test_status"
