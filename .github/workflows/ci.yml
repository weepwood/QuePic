name: Verify Release

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  release-status:
    name: Inspect v0.5.0 release
    runs-on: ubuntu-latest
    steps:
      - name: Inspect release workflow and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          runs="$(curl -fsSL "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&event=push&per_page=5")"
          run_id="$(jq -r '[.workflow_runs[] | select(.head_sha == "cd39643dec982c2815b16452cbd5470042224e88")][0].id // empty' <<< "$runs")"

          if [ -z "$run_id" ]; then
            echo "release_run=not_found"
          else
            jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | "release_run_id=\(.id) status=\(.status) conclusion=\(.conclusion // "pending") html=\(.html_url)"' <<< "$runs"
            jobs="$(curl -fsSL "${headers[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=20")"
            jq -r '.jobs[] | "job_id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // "pending")"' <<< "$jobs"
          fi

          release="$(curl -fsSL "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v0.5.0")"
          jq -r '"release_id=\(.id) draft=\(.draft) prerelease=\(.prerelease) html=\(.html_url)"' <<< "$release"
          jq -r '.assets[]? | "asset=\(.name) size=\(.size) state=\(.state) url=\(.browser_download_url)"' <<< "$release"

          exe_count="$(jq '[.assets[]? | select(.state == "uploaded" and (.name | endswith(".exe")))] | length' <<< "$release")"
          dmg_count="$(jq '[.assets[]? | select(.state == "uploaded" and (.name | endswith(".dmg")))] | length' <<< "$release")"
          echo "asset_summary exe=${exe_count} dmg=${dmg_count}"
