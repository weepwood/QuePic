name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quepic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Build React frontend
        run: npm run build

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri backend
        shell: bash
        run: |
          set +e
          cargo check --quiet --message-format=short --manifest-path src-tauri/Cargo.toml > cargo-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Rust 编译失败，错误上下文如下："
            grep -E -C 4 '(^error|error\[|failed to run custom build command|could not compile)' cargo-check.log | tail -n 180 || tail -n 180 cargo-check.log
          fi
          exit "$status"
