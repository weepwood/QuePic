name: Apply Yuque Library Feature

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-feature:
    if: github.head_ref == 'feat/yuque-library-token-tier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply feature patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/feature-apply-trigger
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          parts = sorted(Path('.github/feature-payload').glob('part*'))
          if len(parts) != 5:
              raise SystemExit(f'expected 5 payload parts, got {len(parts)}')
          payload = ''.join(part.read_text().strip() for part in parts)
          script = zlib.decompress(base64.b64decode(payload))
          path = Path('/tmp/apply_feature.py')
          path.write_bytes(script)
          compile(script, str(path), 'exec')
          exec(compile(script, str(path), 'exec'), {'__name__': '__main__'})
          PY

      - name: Format Rust source
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Restore CI and remove temporary payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -rf .github/feature-payload .github/feature-apply-trigger

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: 增加语雀知识库管理与 Token 分级上传'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
