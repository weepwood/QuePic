name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quepic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --silent
      - name: Build React frontend
        run: npm run build

  icons:
    name: Platform icons
    runs-on: ubuntu-latest
    steps:
      - name: Generate icons
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          npm install --silent > /tmp/npm-install.log 2>&1
          set +e
          npm run icons > /tmp/icons.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "图标生成失败："
            tail -n 80 /tmp/icons.log
          fi
          exit "$status"

  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source, lint, check and test backend
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          sudo apt-get update -qq > /tmp/apt.log 2>&1
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config >> /tmp/apt.log 2>&1
          npm install --silent > /tmp/npm-install.log 2>&1
          npm run icons > /tmp/icons.log 2>&1
          rustup default stable > /dev/null
          rustup component add rustfmt clippy > /dev/null

          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          # v0.8 既有架构债务由 #31 跟踪。除以下已登记类别外，新增警告仍按错误处理。
          cargo clippy --quiet --manifest-path src-tauri/Cargo.toml --all-targets -- \
            -D warnings \
            -A dead_code \
            -A clippy::drop_non_drop \
            -A clippy::items_after_test_module \
            -A clippy::manual_clamp \
            -A clippy::too_many_arguments
          cargo check --quiet --manifest-path src-tauri/Cargo.toml
          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib
