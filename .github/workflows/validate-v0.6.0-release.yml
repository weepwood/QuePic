name: Validate v0.6.0 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public release and both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          for attempt in $(seq 1 120); do
            runs_json=$(gh api -X GET "repos/${repo}/actions/workflows/release.yml/runs" -f branch=main -f event=push -f per_page=20)
            release_run_id=$(jq -r '[.workflow_runs[] | select(.head_sha == "68c8c939d1f6124f6dc1d6987496d52c2f4697db")][0].id // empty' <<<"$runs_json")
            if [ -n "$release_run_id" ]; then
              run_json=$(gh api "repos/${repo}/actions/runs/${release_run_id}")
              run_status=$(jq -r '.status' <<<"$run_json")
              run_conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
              jobs_json=$(gh api "repos/${repo}/actions/runs/${release_run_id}/jobs?per_page=20")
              windows_success=$(jq -r 'any(.jobs[]; .name == "Build Windows x64" and .conclusion == "success")' <<<"$jobs_json")
              mac_success=$(jq -r 'any(.jobs[]; .name == "Build macOS Apple Silicon" and .conclusion == "success")' <<<"$jobs_json")
            else
              run_status="missing"
              run_conclusion=""
              windows_success=false
              mac_success=false
            fi

            if release_json=$(gh api "repos/${repo}/releases/tags/v0.6.0" 2>/dev/null); then
              has_exe=$(jq -r 'any(.assets[].name; endswith(".exe"))' <<<"$release_json")
              has_dmg=$(jq -r 'any(.assets[].name; endswith(".dmg"))' <<<"$release_json")
              draft=$(jq -r '.draft' <<<"$release_json")
              prerelease=$(jq -r '.prerelease' <<<"$release_json")
              if [ "$run_status" = "completed" ] && [ "$run_conclusion" = "success" ] && [ "$windows_success" = "true" ] && [ "$mac_success" = "true" ] && [ "$has_exe" = "true" ] && [ "$has_dmg" = "true" ] && [ "$draft" = "false" ] && [ "$prerelease" = "false" ]; then
                echo "Release run: ${release_run_id}"
                jq '{tag_name,name,draft,prerelease,html_url,assets:[.assets[].name]}' <<<"$release_json"
                jq '{jobs:[.jobs[]|{name,status,conclusion}]}' <<<"$jobs_json"
                exit 0
              fi
            fi
            sleep 10
          done

          echo "v0.6.0 release validation timed out" >&2
          exit 1
