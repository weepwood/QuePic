name: Apply per-image daily document idempotency

on:
  push:
    branches: [automation/daily-document-consistency]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/yuque-library-token-tier
          fetch-depth: 0
      - name: Apply per-image idempotency
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin automation/daily-document-consistency
          git show FETCH_HEAD:scripts/apply_per_image_idempotency.py > /tmp/apply_per_image_idempotency.py
          python /tmp/apply_per_image_idempotency.py
          rustfmt --edition 2021 src-tauri/src/yuque_openapi.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: 按图片幂等追加每日文档"
          git push origin HEAD:feat/yuque-library-token-tier
