name: Clean daily document consistency fix

on:
  push:
    branches: [automation/daily-document-consistency]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/yuque-library-token-tier
          fetch-depth: 0
      - name: Clean diagnostics and formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "        if (activeAccountRef.current === item.accountName) {\nawait refreshAccountStatus(item.accountName);\n        }",
              "        if (activeAccountRef.current === item.accountName) {\n          await refreshAccountStatus(item.accountName);\n        }",
          )
          text = text.replace(
              "        const dailyImages: DailyDocumentImage[] = [];\n      const dailyItems: UploadQueueItem[] = [];",
              "        const dailyImages: DailyDocumentImage[] = [];\n        const dailyItems: UploadQueueItem[] = [];",
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm -f DAILY_DOCUMENT_FIX_ERROR.txt
          git checkout 5a249de9b767de3d884c26a1717c52d8f87f1f95 -- src-tauri/src/accounts.rs src-tauri/src/credentials.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 清理审查诊断并统一代码格式"
          git push origin HEAD:feat/yuque-library-token-tier
