name: Inspect Release Once

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: startsWith(github.event.head_commit.message, 'inspect release:')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect v0.1.0 release assets
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let release = null;
            let lastError = null;

            for (let attempt = 1; attempt <= 20; attempt += 1) {
              try {
                const response = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: 'v0.1.0',
                });
                release = response.data;
                if (release.assets.length >= 5) break;
              } catch (error) {
                lastError = error.message;
              }
              await sleep(30000);
            }

            let body;
            if (release) {
              const assets = release.assets.length
                ? release.assets.map((asset) => `- ${asset.name} (${asset.size} bytes, state: ${asset.state})`).join('\n')
                : '- 暂无安装包资产';
              const complete = release.assets.length >= 5 && release.assets.every((asset) => asset.state === 'uploaded');
              body = `## v0.1.0 资产核验\n\n状态：**${complete ? 'complete' : 'incomplete'}**\n\nRelease: ${release.html_url}\n\n资产数：${release.assets.length}\n\n${assets}`;
            } else {
              body = `## v0.1.0 资产核验\n\n状态：**failed**\n\n未能读取 Release。${lastError ? `\n\n错误：${lastError}` : ''}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });
