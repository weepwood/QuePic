name: Release Status Once

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.event.workflow_run.head_sha == 'cc90ec2d93c07057a5228268f0a026bb2dac67f7'
    runs-on: ubuntu-latest
    steps:
      - name: Report release result to PR 1
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = context.payload.workflow_run.conclusion;
            const runUrl = context.payload.workflow_run.html_url;
            let releaseDetails = '未找到 v0.1.0 Release。';

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v0.1.0',
              });
              const assets = release.assets.length
                ? release.assets.map((asset) => `- ${asset.name} (${asset.size} bytes)`).join('\n')
                : '- 暂无安装包资产';
              releaseDetails = `Release: ${release.html_url}\n\nAssets:\n${assets}`;
            } catch (error) {
              releaseDetails += `\n查询错误：${error.message}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `## v0.1.0 发布结果\n\nWorkflow conclusion: **${conclusion}**\n\nRun: ${runUrl}\n\n${releaseDetails}`,
            });
