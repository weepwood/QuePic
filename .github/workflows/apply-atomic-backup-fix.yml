              database_gate: Arc<tokio::sync::RwLock<()>>,
              preview_limiter: Arc<remote_preview::RequestLimiter>,
          }

          impl AppState {
              pub(crate) fn try_database_read(
                  &self,
              ) -> Result<tokio::sync::OwnedRwLockReadGuard<()>, String> {
