name: Apply image library backend

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-backend:
    if: github.head_ref == 'feat/image-library-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Apply backend implementation
        run: |
          python3 .github/scripts/prepare_image_library_patch.py
          python3 .github/scripts/apply_image_library_backend.py
          python3 .github/scripts/fix_image_library_output.py

      - name: Format and verify
        run: |
          rustfmt --edition 2021 \
            src-tauri/src/models.rs \
            src-tauri/src/database.rs \
            src-tauri/src/preview.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/yuque_openapi.rs
          npm install --silent
          npm run icons
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit backend implementation
        run: |
          rm -f package-lock.json
          git checkout origin/main -- src-tauri/icons src-tauri/gen || true
          rm .github/scripts/apply_image_library_backend.py
          rm .github/scripts/prepare_image_library_patch.py
          rm .github/scripts/fix_image_library_output.py
          rm .github/workflows/apply-image-library-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 完善图片归档、语雀目录与压缩缓存"
          git push origin HEAD:feat/image-library-overhaul
