name: Verify v0.1.1 Release Once

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'verify release assets:')
    runs-on: ubuntu-latest
    steps:
      - name: Report v0.1.1 assets
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v0.1.1',
            });
            const assets = release.assets.length
              ? release.assets.map((asset) => `- ${asset.name} (${asset.size} bytes, ${asset.state})`).join('\n')
              : '- 暂无资产';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: `## v0.1.1 Release 资产核验\n\nRelease: ${release.html_url}\n\n资产数：${release.assets.length}\n\n${assets}`,
            });
