name: Run atomic backup fix on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/atomic-backup-restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Extract and apply source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-atomic-backup-fix.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Apply deterministic source patch\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Format and test"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          robust_helper = r'''
          import re
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 1:
                  file_path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if count > 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- old ---\n{old}")

              old_lines = old.strip("\n").splitlines()
              pattern = "\\n".join(
                  r"[ \\t]*" + re.escape(line.lstrip()) if line.strip() else r"[ \\t]*"
                  for line in old_lines
              )
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: indentation-tolerant match expected one result, found {len(matches)}\n"
                      f"--- old ---\n{old}"
                  )
              match = matches[0]
              base_indent = re.match(r"[ \\t]*", match.group(0)).group(0)
              replacement_lines = textwrap.dedent(new).strip("\n").splitlines()
              replacement = "\n".join(
                  base_indent + line if line else "" for line in replacement_lines
              )
              file_path.write_text(
                  text[:match.start()] + replacement + text[match.end():],
                  encoding="utf-8",
              )
          '''
          script = script.replace('\nlib = "src-tauri/src/lib.rs"', '\n' + textwrap.dedent(robust_helper) + '\nlib = "src-tauri/src/lib.rs"', 1)
          Path('/tmp/apply-quepic-fix.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-quepic-fix.sh

      - name: Format and test
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 src-tauri/src/lib.rs src-tauri/src/accounts.rs src-tauri/src/backup.rs
          npm install --silent --no-package-lock
          npm run build
          npm run icons
          cargo check --quiet --manifest-path src-tauri/Cargo.toml
          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib

      - name: Commit patched sources
        shell: bash
        run: |
          rm .github/workflows/apply-atomic-backup-fix.yml
          rm .github/workflows/run-atomic-backup-fix-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 保证备份恢复期间数据库原子切换"
          git push origin HEAD:fix/atomic-backup-restore
