name: Inspect upload routing

on:
  push:
    branches: [feat/primary-account-failover]
    paths: [.github/workflows/inspect-upload-routing.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/primary-account-failover
      - name: Collect routing snippets
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## database quota'
            rg -n -C 35 'pub fn upload_quota_status|pub fn record_upload_attempt|fn unix_timestamp' src-tauri/src/database.rs || true
            echo
            echo '## upload command'
            rg -n -C 40 'async fn upload_image|record_upload_attempt|UploadQuotaStatus' src-tauri/src/lib.rs || true
            echo
            echo '## app routing'
            rg -n -C 25 'prepareUploadContextForAccount|const uploadOne|const uploadAll|const runDueUploads|function resolveRetryTimestamp' src/App.tsx || true
            echo
            echo '## settings account UI'
            rg -n -C 25 'accountProfiles.map|账号配置|账号名称|OpenAPI Token' src/App.tsx || true
          } > upload-routing-inspection.txt
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upload-routing-inspection.txt
          git commit -m 'chore: collect upload routing inspection'
          git push origin HEAD:feat/primary-account-failover
