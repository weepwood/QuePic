name: Inspect upload routing

on:
  push:
    branches: [feat/primary-account-failover]
    paths: [.github/workflows/inspect-upload-routing.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/primary-account-failover
      - name: Collect routing snippets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = {
              'database quota': ('src-tauri/src/database.rs', ['pub fn upload_quota_status', 'record_upload_attempt', 'fn unix_timestamp']),
              'upload command': ('src-tauri/src/lib.rs', ['async fn upload_image', 'record_upload_attempt', 'UploadQuotaStatus']),
              'app routing': ('src/App.tsx', ['prepareUploadContextForAccount', 'const uploadOne', 'const uploadAll', 'const runDueUploads', 'function resolveRetryTimestamp']),
              'settings account UI': ('src/App.tsx', ['accountProfiles.map', '账号配置', '账号名称', 'OpenAPI Token']),
          }
          out = []
          for title, (path, needles) in targets.items():
              out.append(f'## {title}')
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              matched = set()
              for index, line in enumerate(lines):
                  if any(needle in line for needle in needles):
                      matched.update(range(max(0, index - 35), min(len(lines), index + 36)))
              for index in sorted(matched):
                  out.append(f'{index + 1:04d}: {lines[index]}')
              out.append('')
          Path('upload-routing-inspection.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upload-routing-inspection.txt
          git commit -m 'chore: collect upload routing inspection' || exit 0
          git push origin HEAD:feat/primary-account-failover
