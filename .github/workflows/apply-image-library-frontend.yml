name: Apply image library frontend

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-frontend:
    if: github.head_ref == 'feat/image-library-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare frontend patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_image_library_frontend.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("insert_marker = '\\nfunction normalizeError(error: unknown): string {'", "insert_marker = '\\nfunction normalizeError(error: unknown) {'")
          text = text.replace("function normalizeError(error: unknown): string {", "function normalizeError(error: unknown) {")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply frontend implementation
        run: python3 .github/scripts/apply_image_library_frontend.py

      - name: Install dependencies
        run: npm install --silent

      - name: Build React frontend
        run: npm run build 2>&1 | tee /tmp/frontend-build.log

      - name: Capture failure log
        if: failure()
        run: |
          if [ -f /tmp/frontend-build.log ]; then tail -n 260 /tmp/frontend-build.log; fi

      - name: Commit frontend implementation
        run: |
          rm -f package-lock.json
          rm .github/scripts/apply_image_library_frontend.py
          rm .github/workflows/apply-image-library-frontend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 重构图库分类、标签与瀑布流界面"
          git push origin HEAD:feat/image-library-overhaul
