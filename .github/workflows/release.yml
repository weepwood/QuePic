name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            QuePic v0.3.0 新增文件夹图片批量创建语雀文档，并全面优化界面、缓存体积和大队列性能。

            ## 主要更新

            ### 文件夹转语雀文档

            - 选择本地文件夹后递归读取其中的图片
            - 文档标题自动使用顶层文件夹名称
            - 按完整相对路径进行中文自然排序，保证 `1、2、10` 顺序稳定
            - 图片按排序结果串行上传，Markdown 正文顺序与预览一致
            - 使用语雀 OpenAPI Token 创建目标知识库文档
            - Token 仅保存在当前界面内存中，不写入本地存储
            - 上传失败可复用现有 SHA-256 去重结果继续重试

            ### 界面与交互

            - 整体界面统一为语雀绿色与 Ant Design 风格
            - 上传页、图片库、设置页、详情抽屉、状态提示和弹窗使用统一视觉令牌
            - 移除大面积紫色渐变、毛玻璃和过重阴影
            - 优化按钮、输入框、导航、卡片和反馈状态的一致性

            ### 缓存与性能

            - 普通图片缓存改为压缩详情预览与缩略图，显著降低磁盘占用
            - 详情预览最长边限制为 1600px，图库缩略图最长边限制为 320px
            - 上传队列使用 160px 小预览、最多 3 路并发解码和离屏渲染优化
            - 前后端图片上传与回源上限统一提升到 50 MB
            - 保留 GIF、SVG 和 AVIF 源格式，避免动画、矢量和兼容性损失

            ### 稳定性与安全

            - 兼容 MIME 缺失或被标记为 `application/octet-stream` 的图片
            - OpenAPI 客户端禁止自动重定向，避免 Token 被带离固定语雀接口
            - 图片上传与回源继续执行 HTTPS、域名白名单、响应大小和重定向限制
            - 修复 Rust 错误信息解析的生命周期编译问题

            ## 使用说明

            文件夹批量上传仍使用 QuePic 已保存的语雀登录会话上传图片；OpenAPI Token 仅用于创建 Markdown 文档。新建文档不会自动加入知识库目录，需要在语雀中手动加入目录。

            ## 安装说明

            - Windows：下载 NSIS 安装包
            - Linux：提供 AppImage 和 DEB
            - macOS：分别提供 Apple Silicon 与 Intel DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
