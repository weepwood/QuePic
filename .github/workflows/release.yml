name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            QuePic v0.2.0 引入本地优先的图片预览与防盗链兼容能力，并重新设计桌面端界面。

            ## 主要更新

            - 新上传图片自动保存本地原图并生成 512px 缩略图
            - 历史图片按需通过 Rust 携带语雀会话回源并补建缓存
            - 图片库不再直接加载语雀防盗链地址，支持离线浏览已缓存图片
            - 可选启用 `i3.wp.com` WordPress CDN 作为最后兼容兜底，默认关闭
            - 新增缓存数量、占用空间、清理缓存和缓存状态展示
            - 优化上传页、图片库、详情抽屉和设置页 UI
            - 详情抽屉支持关闭按钮、点击遮罩和 Esc 关闭
            - 修复缓存写入、删除和清理之间的并发一致性问题
            - 强化 URL 白名单、重定向限制、大小限制和 Tauri Asset Protocol 访问范围

            ## 安装说明

            - Windows：下载 NSIS 安装包
            - Linux：提供 AppImage 和 DEB
            - macOS：分别提供 Apple Silicon 与 Intel DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
