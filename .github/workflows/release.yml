name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            QuePic v0.2.1 将图片上传请求对齐语雀官网的文档附件上传规范。

            ## 主要更新

            - 上传请求增加 `attachable_type=Doc`、`attachable_id=279127910`、`type=image` 和 `ocr=off`
            - 每次上传从当前 Cookie 动态提取 `yuque_ctoken`，并作为 `ctoken` 查询参数发送
            - Referer 对齐目标语雀文档，Origin、Accept、Accept-Language 和 `X-Requested-With` 等主要请求头与官网一致
            - 支持 gzip、Brotli、deflate 和 Zstandard 压缩响应
            - 保留 HTTP 库自动生成 Host、Content-Length 和 multipart boundary，避免请求体长度不一致
            - Cookie 缺少 CSRF Token 时停止上传并提示重新登录
            - 上传接口继续禁止跨域重定向，降低 Cookie 泄露风险
            - 保留本地原图、缩略图缓存、离线预览和图片库管理能力

            ## 当前上传目标

            - 类型：语雀文档（Doc）
            - 文档 ID：`279127910`
            - 文档地址：`https://www.yuque.com/weepwood/index/xzkrvd5ehffhtwwb`

            ## 安装说明

            - Windows：下载 NSIS 安装包
            - Linux：提供 AppImage 和 DEB
            - macOS：分别提供 Apple Silicon 与 Intel DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
