name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.5.0

            本版本重点完善多账号共享图库、账号级上传上下文、持久上传队列、语雀文档工作流和界面一致性。

            ### 升级后需要完成的设置

            每个语雀账号需要在“设置 → 上传上下文文档”中填写一个该账号有权限访问的具体语雀文档 URL，并点击“验证并保存”。QuePic 会通过该账号的 OpenAPI Token 解析真实文档 ID，避免不同账号共用固定文档导致上传失败。

            ### 多账号共享图库

            - 所有账号上传的图片统一进入同一个本地图库与分类体系
            - 切换账号只改变 Cookie、Token、上传上下文和小时额度，不再切换图库
            - 每条记录保留来源账号，私有图片优先使用来源账号会话回源
            - 图库搜索、排序、分类、多选、批量分类与批量删除全局共享

            ### 上传链路与持久队列

            - 移除固定语雀文档 ID 和固定 Referer，改为每账号独立验证上传上下文
            - 上传上下文仅保存账号名、文档 ID、规范化 URL 和标题，不保存 Cookie 或 Token
            - 上传队列保存到 IndexedDB，可跨刷新、账号切换和应用重启恢复
            - 修复“一小时后上传”只检查一次、任务长期不执行的问题
            - 队列恢复后立即检查，并每分钟持续检查到期任务
            - 自动检查失败时五分钟后重试；无效计划时间恢复为等待上传
            - 继续执行每账号 140 次/小时和最少 25 秒间隔保护

            ### 文件夹转语雀文档

            - 目标知识库直接使用语雀网页 URL，无需数字知识库 ID
            - 未指定目标文档时，以文件夹名称创建 Markdown 文档
            - 指定目标文档时，保留标题与正文并追加图片
            - 文件夹图片同步进入共享图库，并使用文件夹名称分类
            - 拒绝直接追加 Lake 文档，避免格式损坏

            ### 图片管理与界面

            - 增加按最新、最早、文件名、文件大小和分类排序
            - 支持分类数量、全选当前结果、批量分类和批量删除本地记录
            - 统一按钮、图标按钮、输入框、卡片、弹窗的边框、圆角、高度和间距
            - 优化上传页、图库、设置页、文档页、滚动条与响应式布局

            ### 安全与兼容

            - Cookie 与 OpenAPI Token 继续保存在操作系统密钥库
            - 上传上下文仅接受 HTTPS `yuque.com` 具体文档 URL
            - 图片远程地址仅接受受信任的语雀与 Nlark 域名
            - 网络请求禁止自动重定向，并限制响应体与图片体积
            - 现有图片索引和缓存无需迁移，升级后自动汇总显示各账号历史图片

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
