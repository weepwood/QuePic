name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.7.0

            本版本重点升级图片归档、语雀每日文档、缓存策略和备份恢复可靠性。

            ### 图片文件夹与标签

            - 将原有单一分类升级为“一个主要文件夹 + 多个标签”的轻量管理模型
            - 支持创建文件夹、上传时选择文件夹并填写多个标签
            - 图库支持文件夹与标签联合筛选，搜索范围包含标签文本
            - 图片详情可直接修改所属文件夹与标签
            - 旧版分类会自动迁移为文件夹，无需手动处理数据库
            - 重复上传且未填写新标签时会保留原有标签

            ### 图库与原图体验

            - 图库增加文件夹与标签导航区域
            - 原始比例模式改为瀑布流，改善不同宽高图片的排列
            - 方形模式继续提供规则网格
            - 图片详情顶部完整展示图片内容，不再裁切主体
            - 外部链接改为通过系统默认浏览器打开
            - 保存原图时按需从语雀远程地址回源，不依赖完整本地原图缓存

            ### 本地缓存优化

            - 不再长期保存上传原文件副本
            - 为每张图片生成详情预览和缩略图两级 JPEG 缓存
            - 详情预览目标不超过 820 KB，缩略图目标不超过 160 KB
            - 单张图片两级缓存目标合计控制在约 1 MB 内
            - 超限时自动降低质量与尺寸
            - 透明图片在转为 JPEG 前铺设白色背景，避免透明区域变黑

            ### 语雀每日文档

            - 每日文档正文不再重复写入 H1 日期标题
            - 新建或更新每日文档后自动检查知识库目录
            - 文档未登记时自动插入目录，已存在时避免重复节点
            - 每张图片继续使用幂等标记，重试不会重复追加

            ### 备份恢复可靠性

            - 数据库命令统一使用读锁，备份导入和导出使用独占写锁
            - 数据库替换前执行 WAL checkpoint
            - 设置恢复在预检成功后原子提交账号列表
            - 备份恢复期间避免并发访问旧数据库或替换中的数据库文件

            ### 升级说明

            - 数据库会在启动时自动创建文件夹和标签表，并迁移旧分类
            - 旧缓存可以继续读取；后续查看图片时会按新的两级压缩策略逐步重建
            - 当前备份恢复核心数据安全已完成，前端全局维护提示与更多故障注入测试将在后续版本继续补齐

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
