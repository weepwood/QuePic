name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.4.0

            本版本重点完善多账号隔离、上传治理、图片分类、缓存恢复和可迁移备份。

            ### 多账号与凭据

            - 支持创建、登录和切换多个语雀账号
            - Cookie、OpenAPI Token、图片记录、分类和上传额度按账号隔离
            - Cookie 与 Token 继续保存在操作系统密钥库，不进入备份文件

            ### 设置与缓存备份

            - 支持仅设置、设置与图片索引、完整缓存三档导出与导入
            - 完整恢复采用数据库与缓存双备份，任一步骤失败都会尝试恢复原数据
            - 校验 ZIP 路径、条目数量、解压体积和 SQLite 完整性
            - 导入后按当前设备目录重新建立缓存索引

            ### 图片管理

            - 新增图片分类、分类筛选和详情修改
            - 文件夹上传自动使用文件夹名称分类
            - 同账号 SHA-256 去重，不同账号保留各自独立的语雀 URL
            - 相同内容共享本地缓存，最后一个引用删除后才清理物理文件

            ### 上传与缓存恢复

            - 每账号滚动一小时最多 140 次远程上传尝试
            - 远程上传最小间隔 25 秒，失败请求也计入本地额度
            - 上传闸门内二次去重，避免多个入口并发重复上传
            - 清缓存后按需、限速恢复远程缩略图
            - 图库使用优化缩略图，详情页从原始 URL 恢复高清预览

            ### 文件夹转文档

            - 作为侧边栏一级功能提供
            - 按自然顺序串行上传图片并生成 Markdown 文档
            - OpenAPI Token 按账号从系统密钥库读取

            ### 数据迁移

            - 自动迁移旧版全局 SHA-256 唯一约束为账号级唯一约束
            - 已有图片、分类、缓存索引和系统密钥库凭据无需手工迁移

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
