name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.8.0

            本版本重点升级文件夹转文档的任务可靠性、主子账号上传路由和统一设置体验。

            ### 文件夹转文档

            - 文件夹任务组件保持常驻，切换上传、图库或设置页面后不会丢失文件列表、进度和结果
            - 文件夹页面移除重复的知识库 URL、文档 URL、Token 与账号配置
            - 统一读取设置页中的主账号知识库和目标文档
            - 每张图片显示实际上传账号与处理状态
            - 所有可用账号额度耗尽后自动等待下一整点继续

            ### 主子账号上传

            - 主账号负责 Cookie、OpenAPI Token、文档目标和大图片上传
            - 子账号只需保存 Cookie，不需要 Token，也不需要单独配置文档
            - 不超过 10 MB 的图片优先使用子账号，最后回退主账号
            - 超过 10 MB 且不超过 50 MB 的图片只使用主账号
            - 普通上传与文件夹转文档共用同一个路由模块
            - 每个账号独立按自然整点小时计算上传额度
            - 子账号返回的图片链接统一由主账号写入语雀文档

            ### 设置与凭据

            - 账号、主子角色、Cookie、Token、语雀目标、额度和缓存合并到统一设置面板
            - Cookie 与 Token 默认隐藏，可按需显示和复制
            - 子账号界面不再显示无用的 Token 和文档权限配置
            - 清理重复功能与无效设置入口

            ### 队列与可靠性

            - 上传队列记录实际上传账号
            - 上传成功结果优先持久化，文档写入重试不会重复上传
            - 上传失败尝试计入对应账号当前整点小时额度
            - 修复子账号历史上传上下文可能覆盖主账号上下文的问题

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
