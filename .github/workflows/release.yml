name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.9.0

            本版本将 QuePic 从语雀图片管理工具扩展为本地优先的语雀文件云盘，同时保留现有图片上传、图库与文档发布能力。

            ### 语雀云盘

            - 新增独立语雀云盘界面、文件列表和持久化本地索引
            - 支持 Office、WPS、PDF、文本、图片、设计文件、思维导图、压缩包、音频和视频等常见附件
            - 使用系统文件选择器获取真实路径，由 Rust 流式上传，避免大文件进入 WebView 内存
            - 使用语雀网页附件上传模式，并兼容有文档上下文与无文档上下文上传
            - 本地 SQLite 管理文件夹、标签、来源账号、SHA-256 和语雀下载地址
            - 同一账号下按 SHA-256 去重，重复文件可复用已有远程地址

            ### 原始文件下载

            - 优先保存语雀返回的原始下载地址，而不是预览地址
            - 点击下载时使用来源账号会话回源原始文件
            - 采用同目录临时文件写入后提交，避免下载中断留下不完整目标文件
            - 拦截 HTML 登录页、空附件、异常响应和超过 1 GB 本地保护上限的文件

            ### 安全与隐私

            - 上传和下载仅允许语雀及 Nlark HTTPS 域名
            - Cookie 只发送到语雀域名，每次下载重定向都会重新验证目标域名
            - 上传日志不记录完整本地文件路径，也不会记录 Cookie 或 Token
            - 删除文件默认只删除本地 SQLite 索引，不删除语雀服务器上的附件

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            语雀网页附件接口属于非公开接口，具体格式、大小、权限和频率限制以语雀服务端响应为准。Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
