name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.8.1

            本版本重点修复子账号上传链路，并增加完整的上传请求日志模块，便于定位语雀接口、账号会话和响应异常。

            ### 子账号上传修复

            - 子账号使用自身语雀 Cookie 直接上传图片，不再要求文档 ID
            - 子账号上传不再携带主账号文档 Referer，避免账号与文档权限不匹配
            - 子账号取得的图片链接继续由主账号 OpenAPI Token 写入当天文档
            - 主账号仍保留文档关联上传和最大 50 MB 图片上传能力
            - 前后端上传上下文参数改为可选，并增加成对校验

            ### 上传请求日志

            - 侧边栏新增“上传日志”入口，可在任意页面查看
            - 每次上传使用独立请求 ID，记录请求准备、命令发送、成功响应和失败响应
            - 展示实际上传账号、上传模式、文件信息、文档上下文、耗时、远程链接和错误结果
            - 支持阶段筛选、全文搜索、单条复制、批量复制、JSON 导出和清空
            - 日志保存在本地，最多保留 300 条，不影响上传主流程

            ### 安全与隐私

            - 不记录图片二进制内容，仅记录文件字节数
            - 自动脱敏 Cookie、Token、ctoken、Authorization、密码和会话字段
            - 对错误文本和 URL 查询参数进行内容级脱敏，避免凭据进入日志或导出文件

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
