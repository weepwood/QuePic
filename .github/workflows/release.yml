name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.6.0

            本版本完成了图片上传、语雀知识库与文档工作流、共享图库和原图查看体验的一次完整升级。

            ### 语雀知识库与文档

            - 配置 OpenAPI Token 后，可直接读取知识库和文档列表
            - 可一键创建或复用私有知识库 `QuePic 文件夹文档`
            - 文件夹转文档支持创建 Markdown 文档、追加到现有文档、打开和删除远程文档
            - Token 模式会自动创建或查找当天 `YYYY-MM-DD` 图片文档
            - 图片按照 Markdown `![文件名](远程链接)` 写入当天文档
            - 每张图片带独立幂等标记，重试只补写缺失图片，不会重复追加
            - 文档同步失败的任务会返回持久队列，重启后仍可继续，且复用历史链接不重复占用上传额度

            ### 图片上传与队列

            - 无 Token 时单张图片最大 10 MB
            - 配置有效 Token 后单张图片最大 50 MB
            - 前端选择与 Rust 上传前均执行强制校验
            - 取消每张图片 25 秒固定等待，当前小时额度内连续上传
            - 超出滚动一小时额度的任务自动进入下一额度窗口
            - 持久队列支持账号隔离、应用重启恢复和到期自动续传

            ### 共享图库与原图查看

            - 多账号共用同一个本地图库，同时保留图片来源账号
            - 图库支持原始比例与统一方格两种显示模式
            - 历史图片缺少宽高信息时，会读取自然尺寸补全显示比例
            - 新增应用内原图查看器，支持适应窗口、100%、放大、缩小和快捷键
            - 原图通过 Tauri 本地文件协议显示，不会因浏览器响应头而自动下载
            - “保存原图”使用系统保存对话框
            - 精确原图与轻量预览缓存已分离，缩略图不会再冒充原图
            - 原图请求会移除 `x-oss-process` 图片变换参数

            ### 界面与可靠性

            - 重新整理文件夹转文档页面的内容宽度、卡片边距、模块间距和响应式布局
            - 统一按钮、图标按钮、输入框、工具栏和弹窗的尺寸、边框及内外边距
            - 增强备份恢复时的原图与预览缓存识别
            - 语雀 OpenAPI 请求继续使用浏览器 User-Agent 和 Accept-Language，避免管理规则 403

            ### 升级说明

            - 数据库无需手动迁移
            - 旧版 `preview.*` 文件会被视为预览缓存；首次查看原图时应用会重新回源真实原图
            - 无 Token 账号仍需手动配置一个有权限的语雀文档作为上传上下文
            - Token 账号会自动使用当天图片文档作为上传上下文

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
