name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install --silent

      - name: Generate platform icons
        run: npm run icons

      - name: Build and publish QuePic
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macOS') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: QuePic v__VERSION__
          releaseBody: |
            ## QuePic v0.5.1

            本版本修复语雀 OpenAPI 请求因缺少浏览器 User-Agent 而返回 HTTP 403 的问题。

            ### 修复内容

            - 为语雀 OpenAPI 客户端统一设置浏览器 User-Agent：
              `Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36`
            - 同时设置 `Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-US;q=0.7`
            - 覆盖知识库读取、上传上下文验证、文档读取、文档创建和文档更新请求
            - 保留禁止自动重定向、连接超时与响应体大小限制
            - 增加单元测试，验证默认 User-Agent 与 Accept-Language 请求头

            ### 解决的问题

            修复以下错误：

            `读取语雀知识库失败（HTTP 403）：Request forbidden by administrative rules. Please make sure your request has a User-Agent header.`

            ### 安装包

            - Windows x64：NSIS
            - macOS Apple Silicon：DMG

            Windows 安装包尚未进行商业代码签名；macOS 使用临时签名但未公证，操作系统可能显示未知开发者提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: QuePic_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }}
