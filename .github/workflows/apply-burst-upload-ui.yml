name: Apply burst upload and document UI

on:
  push:
    branches: [feat/yuque-library-token-tier]
    paths:
      - .github/trigger-burst-upload-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yuque-library-token-tier
          fetch-depth: 0
      - name: Apply upload scheduling and UI plan
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one regex replacement in {path}, got {count}: {pattern}')
              target.write_text(updated, encoding='utf-8')

          replace_once(
              'src-tauri/src/database.rs',
              'pub const UPLOAD_MINIMUM_INTERVAL_SECONDS: i64 = 25;',
              'pub const UPLOAD_MINIMUM_INTERVAL_SECONDS: i64 = 0;',
          )
          replace_once(
              'src-tauri/src/database.rs',
              '    fn reports_upload_quota_and_spacing() {',
              '    fn reports_hourly_quota_without_per_image_spacing() {',
          )
          replace_once(
              'src-tauri/src/database.rs',
              '        assert!(after.retry_after_seconds > 0);',
              '        assert_eq!(after.retry_after_seconds, 0);\n        assert_eq!(after.minimum_interval_seconds, 0);',
          )

          replace_once(
              'src-tauri/src/lib.rs',
              '    sync::{Arc, Mutex},\n    time::Duration,',
              '    sync::{Arc, Mutex},',
          )
          replace_once(
              'src-tauri/src/lib.rs',
              '    if quota.retry_after_seconds > 0 {\n        tokio::time::sleep(Duration::from_secs(quota.retry_after_seconds as u64)).await;\n    }\n\n',
              '',
          )

          upload_one = '''  const uploadOne = useCallback(async (id: string, deferRefresh = false) => {
    const item = queueRef.current.find((candidate) => candidate.id === id);
    if (!item || item.status === 'uploading' || item.status === 'success') return false;
    const credential = await getCredentialStatus(item.accountName);
    if (!credential.configured) {
      const failed = markQueueItem(id, {
        status: 'failed',
        scheduledAt: null,
        error: `账号“${item.accountName}”尚未保存有效语雀会话。`,
      });
      if (failed) await saveStoredQueueItem(toStoredQueueItem(failed));
      return false;
    }

    markQueueItem(id, { status: 'uploading', scheduledAt: null, error: undefined });
    try {
      const result = await uploadImage(item.file, item.accountName, item.width, item.height, item.category);
      markQueueItem(id, { status: 'success', result, scheduledAt: null, error: undefined });
      await removeStoredQueueItem(id);
      if (!deferRefresh) {
        await Promise.all([refreshAssets(), refreshCacheStats(), refreshProfiles()]);
        if (activeAccountRef.current === item.accountName) {
          await refreshAccountStatus(item.accountName);
        }
      }
      return true;
    } catch (error) {
      const failed = markQueueItem(id, {
        status: 'failed',
        scheduledAt: null,
        error: normalizeError(error),
      });
      if (failed) await saveStoredQueueItem(toStoredQueueItem(failed));
      if (!deferRefresh && activeAccountRef.current === item.accountName) {
        await refreshAccountStatus(item.accountName);
      }
      return false;
    }
  }, [markQueueItem, refreshAccountStatus, refreshAssets, refreshCacheStats, refreshProfiles]);'''
          regex_once(
              'src/App.tsx',
              r"  const uploadOne = useCallback\(async \(id: string\) => \{.*?\n  \}, \[markQueueItem, refreshAccountStatus, refreshAssets, refreshCacheStats, refreshProfiles\]\);",
              upload_one,
          )

          upload_all = '''  const uploadAll = async () => {
    if (!credentialReady) {
      setView('settings');
      return showToast('error', '请先为当前账号登录语雀并保存会话。');
    }
    if (!uploadContext) {
      setView('settings');
      return showToast('error', '请先为当前账号配置一个有权限的语雀文档作为上传上下文。');
    }

    const pendingItems = queueRef.current.filter(
      (item) => item.accountName === accountName && ['waiting', 'failed', 'scheduled'].includes(item.status),
    );
    if (pendingItems.length === 0) return showToast('error', '当前账号没有等待上传的图片。');

    const scheduleBatch = async (items: UploadQueueItem[], scheduledAt: number, reason: string) => {
      const ids = new Set(items.map((item) => item.id));
      const updated: UploadQueueItem[] = [];
      commitQueue((current) => current.map((item) => {
        if (!ids.has(item.id)) return item;
        const next: UploadQueueItem = { ...item, status: 'scheduled', scheduledAt, error: reason };
        updated.push(next);
        return next;
      }));
      await saveStoredQueueItems(updated.map(toStoredQueueItem));
    };

    try {
      const currentQuota = await getUploadQuotaStatus(accountName);
      setQuota(currentQuota);
      if (currentQuota.remaining <= 0) {
        const scheduledAt = resolveRetryTimestamp(currentQuota.reset_at);
        await scheduleBatch(pendingItems, scheduledAt, '当前小时额度已满，等待下一批');
        showToast('success', `当前小时额度已用完，${pendingItems.length} 张图片已安排在 ${formatScheduleTime(scheduledAt)} 自动继续。`);
        return;
      }

      const immediateItems = pendingItems.slice(0, currentQuota.remaining);
      const overflowItems = pendingItems.slice(currentQuota.remaining);
      let successCount = 0;
      for (const item of immediateItems) {
        if (await uploadOne(item.id, true)) successCount += 1;
      }

      let scheduledCount = 0;
      let scheduledAt: number | null = null;
      if (overflowItems.length > 0) {
        const refreshedQuota = await getUploadQuotaStatus(accountName);
        scheduledAt = resolveRetryTimestamp(refreshedQuota.reset_at || currentQuota.reset_at);
        await scheduleBatch(overflowItems, scheduledAt, '本批额度已用完，等待下一小时自动上传');
        scheduledCount = overflowItems.length;
      }

      await Promise.all([refreshAssets(), refreshCacheStats(), refreshProfiles(), refreshAccountStatus(accountName)]);
      const summary = [`已立即上传 ${successCount} 张`];
      if (scheduledCount > 0 && scheduledAt) {
        summary.push(`${scheduledCount} 张将在 ${formatScheduleTime(scheduledAt)} 自动继续`);
      }
      showToast('success', summary.join('，'));
    } catch (error) {
      showToast('error', `批量上传失败：${normalizeError(error)}`);
    }
  };

  const scheduleRemaining'''
          regex_once(
              'src/App.tsx',
              r"  const uploadAll = async \(\) => \{.*?\n  \};\n\n  const scheduleRemaining",
              upload_all,
          )

          replace_once(
              'src/App.tsx',
              "      showToast('success', `已计划 ${updated.length} 张图片，将在 ${formatScheduleTime(scheduledAt)} 自动续传。`);",
              "      showToast('success', `已将 ${updated.length} 张图片整体延后，将在 ${formatScheduleTime(scheduledAt)} 自动上传。`);",
          )
          replace_once(
              'src/App.tsx',
              '        for (const item of accountItems.slice(0, accountQuota.remaining)) await uploadOne(item.id);',
              '        for (const item of accountItems.slice(0, accountQuota.remaining)) await uploadOne(item.id, true);',
          )
          replace_once(
              'src/App.tsx',
              '      if (activeAccountRef.current) await refreshAccountStatus(activeAccountRef.current);',
              '      await Promise.all([refreshAssets(), refreshCacheStats(), refreshProfiles()]);\n      if (activeAccountRef.current) await refreshAccountStatus(activeAccountRef.current);',
          )
          replace_once(
              'src/App.tsx',
              '  }, [markQueueItem, refreshAccountStatus, rescheduleItems, showToast, uploadOne]);',
              '  }, [markQueueItem, refreshAccountStatus, refreshAssets, refreshCacheStats, refreshProfiles, rescheduleItems, showToast, uploadOne]);',
          )
          replace_once(
              'src/App.tsx',
              '  const quotaAvailable = !quota || quota.remaining > 0;\n',
              '',
          )
          replace_once(
              'src/App.tsx',
              '<div className="drop-hints"><span>单张 {maxUploadMegabytes} MB</span><span>{tokenReady ? \'Token 增强模式\' : \'无 Token 基础模式\'}</span><span>140 张/小时</span><span>队列持久化</span></div>',
              '<div className="drop-hints"><span>单张 {maxUploadMegabytes} MB</span><span>{tokenReady ? \'Token 增强模式\' : \'无 Token 基础模式\'}</span><span>140 张/小时</span><span>额度内连续上传</span><span>队列持久化</span></div>',
          )
          replace_once(
              'src/App.tsx',
              '<button className="button secondary compact" disabled={pendingUploadCount === 0} onClick={() => void scheduleRemaining()}><CalendarClock size={16} />一小时后上传</button>\n                    <button className="button primary compact" disabled={!credentialReady || !uploadContext || !quotaAvailable || pendingUploadCount === 0} onClick={() => void uploadAll()}><UploadCloud size={16} />全部上传</button>',
              '<button className="button secondary compact" disabled={pendingUploadCount === 0} onClick={() => void scheduleRemaining()}><CalendarClock size={16} />全部延后 1 小时</button>\n                    <button className="button primary compact" disabled={!credentialReady || !uploadContext || pendingUploadCount === 0} onClick={() => void uploadAll()}><UploadCloud size={16} />立即上传本批</button>',
          )
          replace_once(
              'src/App.tsx',
              "                  {quota?.retry_after_seconds ? <b>{formatDuration(quota.retry_after_seconds)} 后可继续</b> : <b>可上传</b>}",
              "                  {quota?.retry_after_seconds ? <b>{formatDuration(quota.retry_after_seconds)} 后进入下一批</b> : <b>额度内连续上传</b>}",
          )
          replace_once(
              'src/App.tsx',
              '<div className="queue-schedule-banner"><CalendarClock size={16} /><span>下一次自动上传：{formatScheduleTime(nextScheduledAt)}</span><small>应用关闭时队列仍会保留，下次启动后自动补传已到期任务。</small></div>',
              '<div className="queue-schedule-banner"><CalendarClock size={16} /><span>下一批自动上传：{formatScheduleTime(nextScheduledAt)}</span><small>本小时额度内会连续处理；超出部分保留到下一额度窗口。应用关闭后会在下次启动补传。</small></div>',
          )
          replace_once(
              'src/App.tsx',
              '<div><strong>{quota?.minimum_interval_seconds ?? 25}s</strong><small>最小间隔</small></div>',
              '<div><strong>连续</strong><small>额度内立即上传</small></div>',
          )
          replace_once(
              'src/App.tsx',
              '<div className="panel-heading"><div><span>UPLOAD GOVERNOR</span><h2>上传速度与额度</h2><p>为语雀上传接口保留安全余量，并支持队列跨小时自动续传。</p></div><Gauge size={20} /></div>',
              '<div className="panel-heading"><div><span>UPLOAD GOVERNOR</span><h2>上传批次与额度</h2><p>当前小时额度内连续上传；额度用完后，剩余任务自动进入下一批。</p></div><Gauge size={20} /></div>',
          )
          replace_once(
              'src/App.tsx',
              '<p className="panel-note">失败请求也计入本地额度。无 Token 单图上限 10 MB，保存 Token 后为 50 MB；限制会在前端和 Rust 后端同时校验。队列任务绑定添加时的账号。</p>',
              '<p className="panel-note">不再对每张图片设置固定秒级等待。失败请求仍计入本地小时额度；无 Token 单图上限 10 MB，保存 Token 后为 50 MB。超出当前额度的队列任务会自动安排到下一窗口。</p>',
          )

          replace_once(
              'src/components/BatchDocumentUploader.tsx',
              '        uploadedCount += 1;\n        setQuota(await getUploadQuotaStatus(accountName));',
              '        uploadedCount += 1;',
          )
          replace_once(
              'src/components/BatchDocumentUploader.tsx',
              '      const markdown = uploaded',
              '      setQuota(await getUploadQuotaStatus(accountName));\n\n      const markdown = uploaded',
          )
          replace_once(
              'src/components/BatchDocumentUploader.tsx',
              '<p>粘贴语雀网页 URL 自动识别知识库；可以新建同名文档，也可以追加到现有文档。</p>',
              '<p>先选择知识库和文档，再选择图片文件夹；当前小时额度内会连续完成上传。</p>',
          )
          replace_once(
              'src/components/BatchDocumentUploader.tsx',
              '<strong>图片库与安全限速</strong>\n            <small>每张图片上传成功后立即写入当前账号图片库，并按文件夹名分类；重复图片复用历史链接，不消耗远程上传额度。</small>',
              '<strong>图片库与批量上传</strong>\n            <small>当前小时剩余额度内连续处理，不再为每张图片强制等待；上传成功后立即写入图片库并按文件夹名分类，重复图片复用历史链接。</small>',
          )

          Path('src/batch-document.css').write_text(r'''.batch-doc-hidden-input {
  display: none;
}

.batch-doc-page {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
}

.batch-doc-panel {
  display: grid;
  gap: 24px;
  width: 100%;
  max-width: none;
  padding: 24px;
}

.batch-doc-panel > .panel-heading {
  align-items: flex-start;
  margin: 0;
  padding-bottom: 20px;
  border-bottom: 1px solid #f0f0f0;
}

.batch-doc-panel > .panel-heading > svg {
  flex: 0 0 auto;
  color: var(--primary);
}

.batch-doc-status-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 0;
}

.status-card {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  padding: 14px 16px;
  border: 1px solid #f0f0f0;
  border-radius: 10px;
  background: #fafafa;
}

.status-card strong {
  color: #595959;
  font-size: 13px;
}

.status-card small {
  overflow: hidden;
  color: #8c8c8c;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.status-card.ready {
  border-color: #b7eb8f;
  background: #f6ffed;
}

.status-card.ready strong,
.status-card.ready small {
  color: #168f4d;
}

.batch-doc-target-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin: 0;
  padding: 20px;
  border: 1px solid #f0f0f0;
  border-radius: 14px;
  background: #fafafa;
}

.batch-doc-target-grid .field {
  min-width: 0;
}

.batch-doc-target-preview {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0;
  padding: 12px 14px;
  border: 1px solid #b7eb8f;
  border-radius: 10px;
  color: #168f4d;
  background: #f6ffed;
}

.batch-doc-target-preview.error {
  border-color: #ffccc7;
  color: #cf1322;
  background: #fff2f0;
}

.batch-doc-target-preview > div {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.batch-doc-target-preview strong,
.batch-doc-target-preview small {
  overflow-wrap: anywhere;
}

.batch-doc-target-preview small {
  color: inherit;
  opacity: .78;
}

.batch-doc-folder-card {
  margin: 0;
  overflow: hidden;
  border: 1px solid #f0f0f0;
  border-radius: 14px;
  background: #fff;
}

.batch-doc-folder-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 72px;
  padding: 16px 18px;
  background: #fafafa;
}

.batch-doc-folder-summary > div:first-child {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  color: var(--primary);
}

.batch-doc-folder-summary > div:first-child > div {
  display: flex;
  flex-direction: column;
  gap: 3px;
