  background: #f6ffed;
}

.yuque-manager-item > span,
.yuque-document-row > button span {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.yuque-manager-item strong,
.yuque-document-row strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.yuque-manager-item b,
.yuque-document-row b {
  flex: 0 0 auto;
  padding: 2px 6px;
  border-radius: 999px;
  color: var(--primary-dark);
  background: var(--primary-soft);
  font-size: 10px;
}

.yuque-manager-item small,
.yuque-document-row small {
  overflow: hidden;
  color: var(--muted);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.yuque-manager-item > svg,
.yuque-document-row > button > svg {
  position: absolute;
  top: 50%;
  right: 12px;
  color: var(--primary);
  transform: translateY(-50%);
}

.yuque-document-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 34px 34px;
  align-items: stretch;
  gap: 5px;
}

.yuque-document-row > a,
.yuque-document-row > button.danger {
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
}

.yuque-document-row > a {
  color: var(--muted);
}

.yuque-document-row > button.danger {
  color: var(--danger);
}

.yuque-document-row > a:hover,
.yuque-document-row > button.danger:hover {
  border-color: #e8e8e8;
  background: #f5f5f5;
}

.yuque-manager-selection {
  gap: 8px;
  min-height: 44px;
  padding: 10px 13px;
  border: 1px solid #d9f7be;
  border-radius: 10px;
  background: #f6ffed;
}

.yuque-manager-selection a {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 5px;
  margin-left: auto;
  color: var(--primary-dark);
}

.yuque-manager-error {
  padding: 11px 13px;
  border: 1px solid #ffccc7;
  border-radius: 10px;
  color: var(--danger);
  background: #fff2f0;
}

.yuque-manager-empty {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 18px;
  border: 1px dashed #d9d9d9;
  border-radius: 12px;
  background: #fafafa;
}

.yuque-manager-empty strong {
  display: block;
  margin-bottom: 4px;
}

@media (max-width: 1280px) {
  .batch-doc-status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .batch-doc-target-grid,
  .yuque-manager-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 760px) {
  .batch-doc-panel {
    gap: 18px;
    padding: 18px;
  }

  .batch-doc-status-grid {
    grid-template-columns: 1fr;
  }

  .batch-doc-folder-summary,
  .batch-doc-footer,
  .yuque-manager-heading {
    align-items: stretch;
    flex-direction: column;
  }

  .batch-doc-folder-actions,
  .yuque-manager-actions {
    width: 100%;
  }

  .batch-doc-folder-actions button,
  .yuque-manager-actions button {
    flex: 1;
  }

  .batch-doc-footer small {
    text-align: left;
  }

  .yuque-manager-selection {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .yuque-manager-selection a {
    width: 100%;
    margin-left: 24px;
  }
}
