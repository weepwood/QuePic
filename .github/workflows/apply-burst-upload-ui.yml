/* QuePic Yuque OpenAPI document manager */
.yuque-document-manager {
  display: grid;
  gap: 18px;
  padding: 20px;
  border: 1px solid #e8e8e8;
  border-radius: 16px;
  background: #fafafa;
}

.yuque-manager-heading,
.yuque-manager-actions,
.yuque-manager-column-title,
.yuque-manager-selection {
  display: flex;
  align-items: center;
}

.yuque-manager-heading {
  justify-content: space-between;
  gap: 20px;
}

.yuque-manager-heading > div:first-child {
  min-width: 0;
}

.yuque-manager-heading span {
