name: Format upload protocol

on:
  push:
    branches:
      - fix/yuque-web-upload-protocol

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yuque-web-upload-protocol
          fetch-depth: 0
      - name: Format Rust source
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --all --manifest-path src-tauri/Cargo.toml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/yuque_attachment.rs
          git commit -m "style: 格式化语雀上传协议实现"
          git push origin HEAD:fix/yuque-web-upload-protocol
