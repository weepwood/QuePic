name: Diagnose folder and account unification

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'feat/primary-account-failover'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/primary-account-failover
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Apply and validate with diagnostics
        shell: bash
        run: |
          set +e
          BASE_HEAD="$(git rev-parse HEAD)"
          : > /tmp/unification.log

          python scripts/apply-folder-account-unification.py >> /tmp/unification.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm install --silent --no-package-lock >> /tmp/unification.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run build >> /tmp/unification.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run icons >> /tmp/unification.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            rustfmt --edition 2021 src-tauri/src/lib.rs src-tauri/src/openapi_token.rs src-tauri/src/database.rs >> /tmp/unification.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check >> /tmp/unification.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo check --manifest-path src-tauri/Cargo.toml >> /tmp/unification.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo test --manifest-path src-tauri/Cargo.toml --lib >> /tmp/unification.log 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -ne 0 ]; then
            cp /tmp/unification.log folder-account-unification-error.txt
            git add folder-account-unification-error.txt
            git commit --only folder-account-unification-error.txt -m 'chore: 记录文件夹与账号改造验证错误'
            git push origin HEAD:feat/primary-account-failover
            exit "$status"
          fi

          for path in package-lock.json src-tauri/Cargo.lock src-tauri/icons src-tauri/gen; do
            if git cat-file -e "${BASE_HEAD}:${path}" 2>/dev/null; then
              git checkout "$BASE_HEAD" -- "$path"
            else
              rm -rf "$path"
            fi
          done
          rm -f scripts/apply-folder-account-unification.py folder-account-unification-error.txt
          git add -A
          git commit -m 'feat: 持久化文件夹任务并统一主子账号设置'
          git push origin HEAD:feat/primary-account-failover

      - name: Remove temporary workflow from main
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/quepic-main
          cd /tmp/quepic-main
          rm -f .github/workflows/diagnose-folder-account-unification.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: 清理文件夹与账号改造诊断执行器' || exit 0
          git push origin HEAD:main
