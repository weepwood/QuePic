name: Format Cloud Drive Rust

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.head_ref == 'feat/yuque-cloud-drive' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yuque-cloud-drive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: |
          cargo fmt --all --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/format-cloud-drive-rust.yml
      - name: Commit formatted sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: 格式化语雀云盘 Rust 代码"
          git push origin HEAD:feat/yuque-cloud-drive
