name: Commit clean folder and account diff

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  commit-clean:
    if: github.event.pull_request.head.ref == 'feat/primary-account-failover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/primary-account-failover
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean diff and update copy
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old_import = "  nextHourlyResetTimestamp,\n  prioritizeUploadProfiles,\n  uploadLimitForProfile,\n"
          new_import = "  nextHourlyResetTimestamp,\n  NO_TOKEN_MAX_UPLOAD_BYTES,\n  prioritizeUploadProfiles,\n  TOKEN_MAX_UPLOAD_BYTES,\n  uploadLimitForProfile,\n"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          text = text.replace(
              "const NO_TOKEN_MAX_UPLOAD_BYTES = 10 * 1024 * 1024;\nconst TOKEN_MAX_UPLOAD_BYTES = 50 * 1024 * 1024;\n",
              "",
              1,
          )
          text = text.replace(
              '主账号负责当天文档；主账号额度用满后，已登录且已绑定上传上下文的从账号会自动接力，图片仍统一写入主账号当天文档。',
              '主账号负责当天文档和大图；已登录子账号优先处理不超过 10 MB 的小图，图片链接仍统一写入主账号当天文档。',
          )
          text = text.replace('从账号', '子账号')
          path.write_text(text, encoding='utf-8')
          PY

          git rm -r --ignore-unmatch src-tauri/icons
          git checkout origin/main -- src-tauri/icons || true
          git checkout origin/main -- src-tauri/src/credentials.rs
          rm -f package-lock.json src-tauri/Cargo.lock
          rm -rf src-tauri/gen

      - name: Validate frontend
        run: |
          npm install --silent --no-package-lock
          npm run build

      - name: Commit clean diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: 收敛主子账号配置与清理生成文件'
          git push origin HEAD:feat/primary-account-failover

      - name: Cleanup workflow
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/quepic-main
          cd /tmp/quepic-main
          rm -f .github/workflows/commit-clean-folder-account-diff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: 清理文件夹与账号改造提交执行器' || exit 0
          git push origin HEAD:main
